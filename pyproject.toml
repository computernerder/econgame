[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "economic-simulation-game"
version = "0.34.0"
description = "Empire Manager: a local real-estate and business simulation."
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "jinja2==3.1.6"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
desktop = ["pywebview==6.2.1", "pythonnet==3.0.5; sys_platform == 'win32'", "clr-loader==0.2.9; sys_platform == 'win32'"]

[project.scripts]
empire-manager = "economic_simulation.desktop:main"
empire-manager-server = "economic_simulation.server:main"

[tool.setuptools.packages.find]
include = ["economic_simulation*"]

[tool.setuptools.package-data]
economic_simulation = ["content/*.json", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
